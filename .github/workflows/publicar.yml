# Publica esta pagina en GitHub Pages.
#
# GitHub Pages SOLO acepta despliegues desde la rama principal del repositorio.
# Por eso aqui no se escribe el nombre de ninguna rama a mano: se compara contra
# la rama principal, la que sea. Hoy la principal es la rama de trabajo; el dia
# que se cambie a main, esto sigue funcionando solo, sin tocar este archivo.
#
# Si el cambio llega a una rama que NO es la principal, el trabajo se salta y la
# corrida queda en gris, no en rojo: no es un error, es que ahi no toca publicar.
name: Publicar la pagina

on:
  push:
    branches:
      - main
      - claude/github-supabase-setup-m2rm77
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Solo publica si esto corre sobre la rama principal del repositorio.
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - name: Bajar los archivos del repositorio
        uses: actions/checkout@v4

      - name: Encender GitHub Pages si esta apagado
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar la pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicacion
        uses: actions/deploy-pages@v4
